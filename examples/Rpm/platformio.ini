; PlatformIO Project Configuration File
;
; Standalone example demonstrating rgblib's RainbowApplication.
; Builds against the library source directly via a relative include
; path (mirrors the -I layout in the repo root's platformio.ini),
; since rgblib's headers are referenced by bare filename across
; several subdirectories rather than through a single public path.
;
; https://docs.platformio.org/page/projectconf.html

[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
build_flags =
  -std=gnu++2a
  -Wall
  -fno-exceptions
  -D RGB_ARDUINO_ESP32
build_unflags =
  -std=gnu++11
  -fexceptions
lib_deps =
  symlink://../..
  bdon/rgblib
  mh-tobi/MCP2515

; Runs the app on the host desktop with pixels rendered in an SDL2 window
; instead of physical LEDs. Requires SDL2 installed system-wide
; (e.g. `brew install sdl2` on macOS, `apt install libsdl2-dev` on Linux)
[env:native_app]
platform = native
lib_deps =
  symlink://../..
build_flags =
  -std=gnu++20
  -D RGB_NATIVE
  !pkg-config --cflags sdl2
  !pkg-config --libs sdl2
